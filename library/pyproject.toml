[project]
name = "foreshadow-library"
version = "0.1.0"
description = "Turns public-domain plays into structured data the Foreshadow app can use."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "httpx>=0.28"]

[project.scripts]
library = "foreshadow_library.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreshadow_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
